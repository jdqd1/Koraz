packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

overrides:
  postcss: 8.5.23
  sharp: 0.35.5
  fast-uri@3: 3.1.8
  fast-uri@4: 4.1.5
  'brace-expansion@1': 1.1.21
  'brace-expansion@4': 5.0.12
  'brace-expansion@5': 5.0.12
  source-map-js: 1.2.2
  prosemirror-view: 1.42.3
  js-yaml: 4.3.2
  nanoid: 3.3.18

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1119.0'
  - '@aws-sdk/s3-request-presigner@3.1119.0'
  - '@better-auth/core@1.7.2'
  - '@better-auth/drizzle-adapter@1.7.2'
  - '@better-auth/kysely-adapter@1.7.2'
  - '@better-auth/memory-adapter@1.7.2'
  - '@better-auth/mongo-adapter@1.7.2'
  - '@better-auth/prisma-adapter@1.7.2'
  - '@better-auth/telemetry@1.7.2'
  - better-auth@1.7.2
  - nodemailer@10.1.0

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch

# Only this upstream advisory is mitigated by the versioned braces depth patch.
# work/test/prod01/braces-regression.mjs runs before every CI audit.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
